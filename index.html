<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Color RGB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="container">
        <h1 class="fw-bold">Selector de Color RGB</h1>
        <div class="color-container mt-4 p-4 rounded">
            <div id="color-box" class="color-box mb-3"></div>
            <p id="color-code" class="fs-4 fw-semibold">#000000</p>
        </div>
        <label for="color-picker" class="form-label fw-semibold">Selecciona un color</label>
        <input type="color" id="color-picker" class="form-control form-control-color mx-auto">
        <div class="color-controls mt-4">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <label for="red" class="form-label fw-semibold">Rojo</label>
                    <input type="range" id="red" min="0" max="255" value="0" class="form-range">
                    <input type="number" id="red-value" min="0" max="255" value="0" class="form-control mt-2">
                </div>
                <div class="col-md-4">
                    <label for="green" class="form-label fw-semibold">Verde</label>
                    <input type="range" id="green" min="0" max="255" value="0" class="form-range">
                    <input type="number" id="green-value" min="0" max="255" value="0" class="form-control mt-2">
                </div>
                <div class="col-md-4">
                    <label for="blue" class="form-label fw-semibold">Azul</label>
                    <input type="range" id="blue" min="0" max="255" value="0" class="form-range">
                    <input type="number" id="blue-value" min="0" max="255" value="0" class="form-control mt-2">
                </div>
            </div>
        </div>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>
